<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova TV</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, sans-serif;
      color: white;
    }
    .logo { font-size: 28px; font-weight: 900; color: #e63946; letter-spacing: 2px; margin-bottom: 16px; text-transform: uppercase; }
    .logo span { color: white; }
    #video-container { width: 100%; max-width: 900px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    video { width: 100%; display: block; }
    #status { margin-top: 14px; font-size: 13px; color: #888; text-align: center; }
    .dot { display: inline-block; width: 8px; height: 8px; background: #e63946; border-radius: 50%; margin-right: 6px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.2} }
    #reload-btn { margin-top: 12px; padding: 10px 28px; background: #e63946; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; display: none; }
    #safari-btn {
      margin-top: 12px;
      padding: 10px 20px;
      background: transparent;
      color: #888;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #safari-btn:hover { border-color: #666; color: #aaa; }
    .buttons { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 4px; }
  </style>
</head>
<body>
<div class="logo">NOVA <span>TV</span></div>
<div id="video-container">
  <video id="video" controls autoplay muted playsinline></video>
</div>
<div id="status"><span class="dot"></span>...</div>
<div class="buttons">
  <button id="reload-btn" onclick="init()">🔄</button>
  <button id="unmute-btn" onclick="unmute()" style="margin-top:12px;padding:10px 24px;background:#e63946;color:white;border:none;border-radius:8px;font-size:15px;cursor:pointer;display:none;">🔊</button>
  
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  const TRANSLATIONS = {
    ru: { loading:'Получаем поток...', connecting:'Подключение...', live:'Nova TV — прямой эфир 🔴', pressPlay:'Нажмите ▶ для воспроизведения', errorStream:'Ошибка — переподключаемся...', errorUrl:'Не удалось получить URL', errorServer:'Ошибка сервера', reconnect:'🔄 Переподключиться', noSupport:'Браузер не поддерживает HLS', openBrowser:'🔗 Открыть в браузере', browserHint:'Для фонового воспроизведения откройте в браузере' },
    bg: { loading:'Зареждаме...', connecting:'Свързване...', live:'Nova TV — на живо 🔴', pressPlay:'Натиснете ▶', errorStream:'Грешка — свързваме...', errorUrl:'Неуспешно', errorServer:'Грешка', reconnect:'🔄 Свържи отново', noSupport:'Браузърът не поддържа HLS', openBrowser:'🔗 Отвори в браузър', browserHint:'За фоново възпроизвеждане отворете в браузър' },
    en: { loading:'Loading stream...', connecting:'Connecting...', live:'Nova TV — Live 🔴', pressPlay:'Press ▶ to play', errorStream:'Error — reconnecting...', errorUrl:'Failed to get URL', errorServer:'Server error', reconnect:'🔄 Reconnect', noSupport:'Browser does not support HLS', openBrowser:'🔗 Open in browser', browserHint:'For background playback open in browser' },
    de: { loading:'Laden...', connecting:'Verbinden...', live:'Nova TV — Live 🔴', pressPlay:'▶ drücken', errorStream:'Fehler — verbinden...', errorUrl:'URL Fehler', errorServer:'Serverfehler', reconnect:'🔄 Neu verbinden', noSupport:'Kein HLS Support', openBrowser:'🔗 Im Browser öffnen', browserHint:'Für Hintergrundwiedergabe im Browser öffnen' },
    fr: { loading:'Chargement...', connecting:'Connexion...', live:'Nova TV — En direct 🔴', pressPlay:'Appuyez ▶', errorStream:'Erreur — reconnexion...', errorUrl:'URL introuvable', errorServer:'Erreur serveur', reconnect:'🔄 Reconnecter', noSupport:'HLS non supporté', openBrowser:'🔗 Ouvrir dans le navigateur', browserHint:'Pour lecture en arrière-plan, ouvrez dans le navigateur' },
    es: { loading:'Cargando...', connecting:'Conectando...', live:'Nova TV — En vivo 🔴', pressPlay:'Presione ▶', errorStream:'Error — reconectando...', errorUrl:'URL fallida', errorServer:'Error servidor', reconnect:'🔄 Reconectar', noSupport:'Sin soporte HLS', openBrowser:'🔗 Abrir en navegador', browserHint:'Para reproducción en fondo, abra en navegador' },
    uk: { loading:'Отримуємо...', connecting:'Підключення...', live:'Nova TV — прямий ефір 🔴', pressPlay:'Натисніть ▶', errorStream:'Помилка — перепідключення...', errorUrl:'URL не знайдено', errorServer:'Помилка сервера', reconnect:'🔄 Перепідключитись', noSupport:'HLS не підтримується', openBrowser:'🔗 Відкрити у браузері', browserHint:'Для фонового відтворення відкрийте у браузері' },
    tr: { loading:'Yükleniyor...', connecting:'Bağlanıyor...', live:'Nova TV — Canlı 🔴', pressPlay:'▶ basın', errorStream:'Hata — bağlanıyor...', errorUrl:'URL alınamadı', errorServer:'Sunucu hatası', reconnect:'🔄 Yeniden Bağlan', noSupport:'HLS desteklenmiyor', openBrowser:'🔗 Tarayıcıda aç', browserHint:'Arka plan oynatma için tarayıcıda açın' },
  };

  function getLang() {
    try {
      const tgLang = Telegram.WebApp.initDataUnsafe?.user?.language_code;
      if (tgLang) { const s = tgLang.split('-')[0].toLowerCase(); if (TRANSLATIONS[s]) return s; }
    } catch(e) {}
    const b = (navigator.language || 'en').split('-')[0].toLowerCase();
    return TRANSLATIONS[b] ? b : 'en';
  }

  const lang = getLang();
  const t = TRANSLATIONS[lang];
  document.documentElement.lang = lang;
  document.getElementById('reload-btn').textContent = t.reconnect;
  document.getElementById('safari-label').textContent = t.openBrowser;

  const STREAM_API = 'https://nova-proxy-eight.vercel.app/api/stream';
  const PROXY_BASE = 'https://nova-proxy-eight.vercel.app/api/proxy?url=';
  const EXTERNAL_URL = 'https://varenik-ai.github.io/nova-tv-app/';

  const video     = document.getElementById('video');
  const status    = document.getElementById('status');
  const reloadBtn = document.getElementById('reload-btn');
  let hls;
  let currentStreamUrl = null;

  function setStatus(key, isError) {
    const msg = t[key] || key;
    status.innerHTML = isError ? `⚠️ ${msg}` : `<span class="dot"></span>${msg}`;
    reloadBtn.style.display = isError ? 'block' : 'none';
  }

  function unmute() {
    video.muted = false;
    video.volume = 1.0;
    document.getElementById('unmute-btn').style.display = 'none';
  }

  // Медиасессия — управление с экрана блокировки
  function setupMediaSession() {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'Nova TV Bulgaria',
        artist: 'Live Stream 🔴',
        album: 'Nova TV',
        artwork: [{ src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Nova_TV_Bulgaria_Logo.svg/200px-Nova_TV_Bulgaria_Logo.svg.png', sizes: '200x200', type: 'image/png' }]
      });
      navigator.mediaSession.setActionHandler('play', () => video.play());
      navigator.mediaSession.setActionHandler('pause', () => video.pause());
    }
  }

  // Не засыпать — Wake Lock API
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        const lock = await navigator.wakeLock.request('screen');
        console.log('Wake Lock активен');
        document.addEventListener('visibilitychange', async () => {
          if (document.visibilityState === 'visible') {
            await navigator.wakeLock.request('screen');
          }
        });
      }
    } catch(e) {
      console.log('Wake Lock недоступен:', e.message);
    }
  }

  function loadStream(url) {
    currentStreamUrl = url;
    const proxiedUrl = PROXY_BASE + encodeURIComponent(url);
    if (hls) hls.destroy();
    setStatus('connecting');

    if (Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3 });
      hls.loadSource(proxiedUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setStatus('live');
        document.getElementById('unmute-btn').style.display = 'block';
        video.muted = false;
        video.volume = 1.0;
        video.play().catch(() => {
          // Браузер заблокировал — запускаем muted, потом unmute
          video.muted = true;
          video.play().then(() => {
            video.muted = false;
            video.volume = 1.0;
          }).catch(() => setStatus('pressPlay'));
        });
        setupMediaSession();
        requestWakeLock();
      });
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) {
          setStatus('errorStream', true);
          setTimeout(init, 3000);
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari — нативный HLS, лучшее фоновое воспроизведение
      video.src = proxiedUrl;
      video.muted = false;
      video.volume = 1.0;
      video.play().catch(() => {
        video.muted = true;
        video.play().then(() => { video.muted = false; video.volume = 1.0; });
      });
      setStatus('live');
      setupMediaSession();
      requestWakeLock();
    }
  }

  async function init() {
    setStatus('loading');
    reloadBtn.style.display = 'none';
    try {
      const r = await fetch(STREAM_API + '?t=' + Date.now());
      const d = await r.json();
      if (d.url) loadStream(d.url);
      else setStatus('errorUrl', true);
    } catch(e) {
      setStatus('errorServer', true);
    }
  }

  init();
  setInterval(init, 25 * 60 * 1000);
</script>
</body>
</html>
