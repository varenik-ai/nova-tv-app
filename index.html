<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova TV</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, sans-serif;
      color: white;
    }
    .logo { font-size: 28px; font-weight: 900; color: #e63946; letter-spacing: 2px; margin-bottom: 16px; text-transform: uppercase; }
    .logo span { color: white; }
    #video-container {
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      position: relative;
    }
    #video-container.fullscreen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      border-radius: 0;
      z-index: 9999;
    }
    video { width: 100%; height: 100%; display: block; object-fit: contain; }
    #fs-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: white;
      font-size: 20px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 10000;
    }
    #status { margin-top: 14px; font-size: 13px; color: #888; text-align: center; }
    .dot { display: inline-block; width: 8px; height: 8px; background: #e63946; border-radius: 50%; margin-right: 6px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.2} }
    #reload-btn { margin-top: 12px; padding: 10px 28px; background: #e63946; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; display: none; }
    #unmute-btn { margin-top: 12px; padding: 10px 24px; background: #e63946; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; display: none; }
  </style>
</head>
<body>
<div class="logo" id="logo">NOVA <span>TV</span></div>
<div id="video-container">
  <video id="video" controls autoplay muted playsinline webkit-playsinline airplay="allow"></video>
  <button id="fs-btn" onclick="toggleFullscreen()">⛶</button>
</div>
<div id="status"><span class="dot"></span>...</div>
<button id="reload-btn" onclick="init()">🔄</button>
<button id="unmute-btn" onclick="unmute()">🔊</button>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  const TRANSLATIONS = {
    ru: { loading:'Получаем поток...', connecting:'Подключение...', live:'Nova TV — прямой эфир 🔴', pressPlay:'Нажмите ▶ для воспроизведения', errorStream:'Ошибка — переподключаемся...', errorUrl:'Не удалось получить URL', errorServer:'Ошибка сервера', reconnect:'🔄 Переподключиться', unmute:'🔊 Включить звук' },
    bg: { loading:'Зареждаме...', connecting:'Свързване...', live:'Nova TV — на живо 🔴', pressPlay:'Натиснете ▶', errorStream:'Грешка — свързваме...', errorUrl:'Неуспешно', errorServer:'Грешка', reconnect:'🔄 Свържи отново', unmute:'🔊 Включи звук' },
    en: { loading:'Loading stream...', connecting:'Connecting...', live:'Nova TV — Live 🔴', pressPlay:'Press ▶ to play', errorStream:'Error — reconnecting...', errorUrl:'Failed to get URL', errorServer:'Server error', reconnect:'🔄 Reconnect', unmute:'🔊 Unmute' },
    de: { loading:'Laden...', connecting:'Verbinden...', live:'Nova TV — Live 🔴', pressPlay:'▶ drücken', errorStream:'Fehler...', errorUrl:'URL Fehler', errorServer:'Serverfehler', reconnect:'🔄 Neu verbinden', unmute:'🔊 Ton an' },
    fr: { loading:'Chargement...', connecting:'Connexion...', live:'Nova TV — En direct 🔴', pressPlay:'Appuyez ▶', errorStream:'Erreur...', errorUrl:'URL introuvable', errorServer:'Erreur serveur', reconnect:'🔄 Reconnecter', unmute:'🔊 Activer le son' },
    es: { loading:'Cargando...', connecting:'Conectando...', live:'Nova TV — En vivo 🔴', pressPlay:'Presione ▶', errorStream:'Error...', errorUrl:'URL fallida', errorServer:'Error servidor', reconnect:'🔄 Reconectar', unmute:'🔊 Activar sonido' },
    uk: { loading:'Отримуємо...', connecting:'Підключення...', live:'Nova TV — прямий ефір 🔴', pressPlay:'Натисніть ▶', errorStream:'Помилка...', errorUrl:'URL не знайдено', errorServer:'Помилка сервера', reconnect:'🔄 Перепідключитись', unmute:'🔊 Увімкнути звук' },
    tr: { loading:'Yükleniyor...', connecting:'Bağlanıyor...', live:'Nova TV — Canlı 🔴', pressPlay:'▶ basın', errorStream:'Hata...', errorUrl:'URL alınamadı', errorServer:'Sunucu hatası', reconnect:'🔄 Yeniden Bağlan', unmute:'🔊 Sesi aç' },
  };

  function getLang() {
    try {
      const tgLang = Telegram.WebApp.initDataUnsafe?.user?.language_code;
      if (tgLang) { const s = tgLang.split('-')[0].toLowerCase(); if (TRANSLATIONS[s]) return s; }
    } catch(e) {}
    const b = (navigator.language || 'en').split('-')[0].toLowerCase();
    return TRANSLATIONS[b] ? b : 'en';
  }

  const lang = getLang();
  const t = TRANSLATIONS[lang];
  document.documentElement.lang = lang;
  document.getElementById('reload-btn').textContent = t.reconnect;
  document.getElementById('unmute-btn').textContent = t.unmute;

  const STREAM_API = 'https://nova-proxy-eight.vercel.app/api/stream';
  const PROXY_BASE = 'https://nova-proxy-eight.vercel.app/api/proxy?url=';

  const video      = document.getElementById('video');
  const container  = document.getElementById('video-container');
  const status     = document.getElementById('status');
  const reloadBtn  = document.getElementById('reload-btn');
  const unmuteBtn  = document.getElementById('unmute-btn');
  const logo       = document.getElementById('logo');
  const fsBtn      = document.getElementById('fs-btn');
  let hls;
  let isFs = false;

  function toggleFullscreen() {
    // Пробуем нативный Fullscreen API
    if (!isFs) {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else if (video.webkitEnterFullscreen) {
        // iPhone Safari
        video.webkitEnterFullscreen();
        return;
      } else {
        // Fallback — CSS fullscreen
        container.classList.add('fullscreen');
        logo.style.display = 'none';
        status.style.display = 'none';
        reloadBtn.style.display = 'none';
        unmuteBtn.style.display = 'none';
        fsBtn.textContent = '✕';
        isFs = true;
        return;
      }
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else {
        container.classList.remove('fullscreen');
        logo.style.display = '';
        status.style.display = '';
        fsBtn.textContent = '⛶';
        isFs = false;
        return;
      }
    }
  }

  // Слушаем нативный fullscreen
  document.addEventListener('fullscreenchange', () => {
    isFs = !!document.fullscreenElement;
    fsBtn.textContent = isFs ? '✕' : '⛶';
    logo.style.display = isFs ? 'none' : '';
    status.style.display = isFs ? 'none' : '';
  });
  document.addEventListener('webkitfullscreenchange', () => {
    isFs = !!document.webkitFullscreenElement;
    fsBtn.textContent = isFs ? '✕' : '⛶';
  });

  function setStatus(key, isError) {
    const msg = t[key] || key;
    status.innerHTML = isError ? `⚠️ ${msg}` : `<span class="dot"></span>${msg}`;
    reloadBtn.style.display = isError ? 'block' : 'none';
  }

  function unmute() {
    video.muted = false;
    video.volume = 1.0;
    unmuteBtn.style.display = 'none';
  }

  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Nova TV Bulgaria',
      artist: 'Live 🔴',
      album: 'Nova TV',
    });
    navigator.mediaSession.setActionHandler('play', () => video.play());
    navigator.mediaSession.setActionHandler('pause', () => video.pause());
    navigator.mediaSession.setActionHandler('stop', () => video.pause());
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async () => {
          if (document.visibilityState === 'visible') {
            try { await navigator.wakeLock.request('screen'); } catch(e) {}
          }
        });
      }
    } catch(e) {}
  }

  function loadStream(url) {
    const proxiedUrl = PROXY_BASE + encodeURIComponent(url);
    if (hls) hls.destroy();
    setStatus('connecting');
    unmuteBtn.style.display = 'none';

    if (Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3, enableWorker: true });
      hls.loadSource(proxiedUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setStatus('live');
        video.muted = true;
        video.play().then(() => {
          unmuteBtn.style.display = 'block';
          setupMediaSession();
          requestWakeLock();
        }).catch(() => setStatus('pressPlay'));
      });
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) {
          setStatus('errorStream', true);
          setTimeout(init, 3000);
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxiedUrl;
      video.muted = true;
      video.play().then(() => {
        unmuteBtn.style.display = 'block';
        setupMediaSession();
        requestWakeLock();
      });
      setStatus('live');
    }
  }

  async function init() {
    setStatus('loading');
    reloadBtn.style.display = 'none';
    unmuteBtn.style.display = 'none';
    try {
      const r = await fetch(STREAM_API + '?t=' + Date.now());
      const d = await r.json();
      if (d.url) loadStream(d.url);
      else setStatus('errorUrl', true);
    } catch(e) {
      setStatus('errorServer', true);
    }
  }

  init();
  setInterval(init, 25 * 60 * 1000);
</script>
</body>
</html>
