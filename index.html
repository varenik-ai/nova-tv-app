<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova TV</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, sans-serif;
      color: white;
    }
    .logo {
      font-size: 28px;
      font-weight: 900;
      color: #e63946;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .logo span { color: white; }
    #video-container {
      width: 100%;
      max-width: 900px;
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    video {
      width: 100%;
      display: block;
    }
    #status {
      margin-top: 14px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: #e63946;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; } 50% { opacity:0.2; }
    }
    #reload-btn {
      margin-top: 16px;
      padding: 10px 28px;
      background: #e63946;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      display: none;
    }
    #reload-btn:hover { background: #c1121f; }
  </style>
</head>
<body>

<div class="logo">NOVA <span>TV</span></div>

<div id="video-container">
  <video id="video" controls autoplay muted playsinline></video>
</div>

<div id="status"><span class="dot"></span>Подключение к эфиру...</div>
<button id="reload-btn" onclick="loadStream()">🔄 Переподключиться</button>

<script>
  // Инициализация Telegram Web App
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  const STREAM_URL = 'https://aistr.xyz:28791/hls/novatv/chunks.m3u8';
  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const reloadBtn = document.getElementById('reload-btn');
  let hls;

  function setStatus(msg, isError) {
    status.innerHTML = isError
      ? `⚠️ ${msg}`
      : `<span class="dot"></span>${msg}`;
    reloadBtn.style.display = isError ? 'block' : 'none';
  }

  function loadStream() {
    if (hls) { hls.destroy(); }
    setStatus('Подключение к эфиру...');

    if (Hls.isSupported()) {
      hls = new Hls({
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        liveSyncDurationCount: 3,
      });
      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setStatus('Nova TV — прямой эфир 🔴');
        video.play().catch(() => {
          setStatus('Нажмите ▶ для воспроизведения');
        });
      });
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          setStatus('Ошибка потока. Попробуйте переподключиться.', true);
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari — нативная поддержка HLS
      video.src = STREAM_URL;
      video.addEventListener('loadedmetadata', () => {
        setStatus('Nova TV — прямой эфир 🔴');
        video.play();
      });
    } else {
      setStatus('Ваш браузер не поддерживает HLS-потоки.', true);
    }
  }

  loadStream();
</script>

</body>
</html>
