<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Nova TV</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { background:#0a0a0a; height:100%; font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:white; overflow:hidden; touch-action:pan-x pan-y pinch-zoom; }

    #player-screen { display:flex; flex-direction:column; align-items:center; height:100%; }

    /* ── Header — всегда поверх всего ── */
    .player-header {
      width:100%; display:flex; align-items:center; gap:10px;
      padding:10px 14px;
      padding-top:calc(10px + max(var(--tg-safe-top,0px), env(safe-area-inset-top,0px)));
      background:#0d0d0d; border-bottom:1px solid #1e1e1e;
      flex-shrink:0; position:relative; z-index:100;
    }
    .back-btn {
      background:#1a1a1a; border:1px solid #333; border-radius:8px;
      padding:7px 14px; color:#ccc; font-size:15px; cursor:pointer;
      -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    }
    .back-btn:active { opacity:.6; }
    .ch-title-bar { font-size:15px; font-weight:700; flex:1; }
    .live-badge-top { background:#e63946; color:#fff; font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; display:none; }

    /* ── Video container ── */
    #video-container { width:100%; flex:1; background:#000; position:relative; overflow:hidden; touch-action:pinch-zoom; }

    video {
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:contain; z-index:1;
      pointer-events:none; /* тапы идут на overlay, не на видео */
    }
    audio { display:none; }

    /* ── Live badge ── */
    .live-badge {
      position:absolute; top:14px; left:14px;
      background:rgba(230,57,70,.95); color:white; font-size:13px;
      padding:5px 12px; border-radius:30px; display:none;
      align-items:center; gap:6px; font-weight:700; z-index:25;
    }

    /* ── Audio badge ── */
    #audio-badge {
      position:absolute; inset:0; display:none;
      align-items:center; justify-content:center;
      z-index:3; pointer-events:none; background:rgba(0,0,0,.85);
    }
    #audio-badge .pill {
      padding:14px 20px; border-radius:999px;
      background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); font-size:15px;
    }
    body.audio-only #audio-badge { display:flex; }
    body.audio-only video { opacity:.02; }

    /* ── Overlay & controls ── */
    .overlay { position:absolute; inset:0; z-index:20; pointer-events:none; transition:opacity .5s ease; }
    .overlay.hidden { opacity:0; pointer-events:none; }
    .controls {
      position:absolute; bottom:0; left:0; right:0;
      background:linear-gradient(transparent,rgba(0,0,0,.92));
      padding:28px 14px; pointer-events:all;
      display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    }
    .btn {
      padding:12px 18px; color:white; border:none; border-radius:10px;
      font-size:14px; cursor:pointer; transition:all .2s;
      flex:1; max-width:160px;
      background:rgba(255,255,255,.12); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.1);
      -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    }
    .btn:active { transform:scale(.96); opacity:.8; }
    .btn.danger { background:#e63946; }
    .btn.reload  { background:#333; }

    /* ── Status ── */
    #status { font-size:13px; color:#888; text-align:center; padding:8px 0 0; flex-shrink:0; }
    .dot { display:inline-block; width:8px; height:8px; background:#e63946; border-radius:50%; margin-right:6px; animation:pulse 1.2s infinite; vertical-align:middle; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  </style>
</head>
<body>

<div id="player-screen">
  <div class="player-header">
    <button class="back-btn" id="back-btn" onclick="closeApp()">✕</button>
    <span class="ch-title-bar">Nova TV</span>
    <span class="live-badge-top" id="live-badge-top">LIVE</span>
  </div>
  <div id="video-container">
    <div class="live-badge" id="live-badge"><span class="dot"></span> LIVE</div>
    <div id="audio-badge"><div class="pill">🎧 Audio mode</div></div>
    <video id="video" autoplay playsinline webkit-playsinline x-webkit-airplay="allow" airplay="allow"></video>
    <div class="overlay" id="overlay">
      <div class="controls">
        <button id="reload-btn"     class="btn reload" style="display:none"></button>
        <button id="unmute-btn"     class="btn danger" style="display:none"></button>
        <button id="mode-btn"       class="btn"></button>
        <button id="fullscreen-btn" class="btn"></button>
        <button id="pip-btn"        class="btn" style="display:none">🎥 PiP</button>
        <button class="btn" onclick="closeApp()">🇧🇬 Каналы</button>
      </div>
    </div>
    <audio id="audio-bg" muted></audio>
  </div>
  <div id="status">...</div>
</div>

<script>
// ── Close app ─────────────────────────────────────────────────────────────────
function closeApp() {
  try { window.Telegram.WebApp.close(); } catch(e) {}
}

const tg = window.Telegram?.WebApp;

// ── Device detection (до tg init) ────────────────────────────────────────────
function isIOS()     { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1) || tg?.platform==='ios'; }
function isAndroid() { return /Android/i.test(navigator.userAgent) || tg?.platform==='android'; }

// ── Safe area ─────────────────────────────────────────────────────────────────
function updateSafeArea() {
  const tgTop = tg?.contentSafeAreaInsets?.top || tg?.safeAreaInsets?.top || 0;
  const top   = tgTop > 0 ? tgTop : (document.fullscreenElement || tg?.isFullscreen ? 32 : 0);
  document.documentElement.style.setProperty('--tg-safe-top', top + 'px');
}

if (tg) {
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes(); } catch(e) {}
  try { tg.setHeaderColor('#000000'); }    catch(e) {}
  try { tg.setBackgroundColor('#000000'); } catch(e) {}
  // Fullscreen Telegram — убираем шапку Telegram на мобильных
  if (isAndroid() || isIOS()) setTimeout(() => { try { tg.requestFullscreen(); } catch(e) {} }, 300);
  try { tg.onEvent('safeAreaChanged',        updateSafeArea); } catch(e) {}
  try { tg.onEvent('contentSafeAreaChanged', updateSafeArea); } catch(e) {}
  setTimeout(updateSafeArea, 500);
}

// ── Локализация ───────────────────────────────────────────────────────────────
const T = {
  ru:{ loading:'Получаем поток...', connecting:'Подключение...', live:'Nova TV — прямой эфир 🔴', pressPlay:'Нажмите ▶', errorStream:'Ошибка — переподключаемся...', errorUrl:'Не удалось получить URL', errorServer:'Ошибка сервера', reconnect:'🔄 Перезапуск', unmute:'🔊 Звук', mute:'🔇 Выкл.', fullscreen:'🔳 Экран', exitFs:'✕ Выйти', audioMode:'🎧 Аудио', videoMode:'🎥 Видео' },
  bg:{ loading:'Зареждаме...', connecting:'Свързване...', live:'Nova TV — на живо 🔴', pressPlay:'Натиснете ▶', errorStream:'Грешка — свързваме...', errorUrl:'Неуспешно', errorServer:'Грешка', reconnect:'🔄 Свържи', unmute:'🔊 Звук', mute:'🔇 Изкл.', fullscreen:'🔳 Екран', exitFs:'✕ Изход', audioMode:'🎧 Аудио', videoMode:'🎥 Видео' },
  en:{ loading:'Loading...', connecting:'Connecting...', live:'Nova TV — Live 🔴', pressPlay:'Press ▶', errorStream:'Error — reconnecting...', errorUrl:'Failed to get URL', errorServer:'Server error', reconnect:'🔄 Reconnect', unmute:'🔊 Unmute', mute:'🔇 Mute', fullscreen:'🔳 Fullscreen', exitFs:'✕ Exit', audioMode:'🎧 Audio only', videoMode:'🎥 Video' },
  de:{ loading:'Laden...', connecting:'Verbinden...', live:'Nova TV — Live 🔴', pressPlay:'▶ drücken', errorStream:'Fehler...', errorUrl:'URL Fehler', errorServer:'Fehler', reconnect:'🔄 Neu', unmute:'🔊 Ton', mute:'🔇 Stumm', fullscreen:'🔳 Vollbild', exitFs:'✕', audioMode:'🎧 Audio', videoMode:'🎥 Video' },
  fr:{ loading:'Chargement...', connecting:'Connexion...', live:'Nova TV — En direct 🔴', pressPlay:'Appuyez ▶', errorStream:'Erreur...', errorUrl:'URL introuvable', errorServer:'Erreur', reconnect:'🔄 Reconnecter', unmute:'🔊 Son', mute:'🔇 Muet', fullscreen:'🔳 Plein', exitFs:'✕ Quitter', audioMode:'🎧 Audio', videoMode:'🎥 Vidéo' },
  es:{ loading:'Cargando...', connecting:'Conectando...', live:'Nova TV — En vivo 🔴', pressPlay:'▶', errorStream:'Error...', errorUrl:'Error URL', errorServer:'Error', reconnect:'🔄 Reconectar', unmute:'🔊 Sonido', mute:'🔇 Silencio', fullscreen:'🔳 Pantalla', exitFs:'✕', audioMode:'🎧 Audio', videoMode:'🎥 Video' },
  uk:{ loading:'Отримуємо...', connecting:'Підключення...', live:'Nova TV — прямий ефір 🔴', pressPlay:'Натисніть ▶', errorStream:'Помилка...', errorUrl:'URL не знайдено', errorServer:'Помилка', reconnect:'🔄 Перепідключитись', unmute:'🔊 Звук', mute:'🔇 Вимкнути', fullscreen:'🔳 Екран', exitFs:'✕ Вийти', audioMode:'🎧 Аудіо', videoMode:'🎥 Відео' },
  tr:{ loading:'Yükleniyor...', connecting:'Bağlanıyor...', live:'Nova TV — Canlı 🔴', pressPlay:'▶', errorStream:'Hata...', errorUrl:'Hata', errorServer:'Hata', reconnect:'🔄 Bağlan', unmute:'🔊 Ses', mute:'🔇 Sessiz', fullscreen:'🔳 Tam ekran', exitFs:'✕', audioMode:'🎧 Ses', videoMode:'🎥 Video' },
};
function getLang() {
  try { const s=tg?.initDataUnsafe?.user?.language_code?.split('-')[0].toLowerCase(); if(s&&T[s]) return s; } catch(e) {}
  const b=(navigator.language||'en').split('-')[0].toLowerCase(); return T[b]?b:'en';
}
const t = T[getLang()];

// ── DOM ───────────────────────────────────────────────────────────────────────
const video         = document.getElementById('video');
const container     = document.getElementById('video-container');
const overlay       = document.getElementById('overlay');
const statusEl      = document.getElementById('status');
const liveBadge     = document.getElementById('live-badge');
const liveBadgeTop  = document.getElementById('live-badge-top');
const reloadBtn     = document.getElementById('reload-btn');
const unmuteBtn     = document.getElementById('unmute-btn');
const modeBtn       = document.getElementById('mode-btn');
const fullscreenBtn = document.getElementById('fullscreen-btn');
const pipBtn        = document.getElementById('pip-btn');

reloadBtn.textContent     = t.reconnect;
unmuteBtn.textContent     = t.unmute;
modeBtn.textContent       = t.audioMode;
fullscreenBtn.textContent = t.fullscreen;

// ── Config ────────────────────────────────────────────────────────────────────
const STREAM_API = 'https://nova-proxy-eight.vercel.app/api/stream';
const PROXY_BASE = 'https://nova-proxy-eight.vercel.app/api/proxy?url=';
const CACHE_KEY  = 'nova_tv_last_url_v4';

// ── State ─────────────────────────────────────────────────────────────────────
let hls = null, hlsAudio = null;
let hideTimeout = null;
let isExpanded  = false;
let audioOnly   = false;
let userUnmuted = false;
let userPaused  = false;
let wakeLockSentinel = null;

// ── PiP ───────────────────────────────────────────────────────────────────────
(function setupPip() {
  if (typeof video.webkitSetPresentationMode === 'function' ||
      typeof video.requestPictureInPicture    === 'function') {
    pipBtn.style.display = 'block';
  }
})();

pipBtn.onclick = async () => {
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
      pipBtn.textContent = '🎥 PiP'; return;
    }
    if (isIOS() && video.webkitSetPresentationMode) {
      // iOS: временно включаем звук — иначе PiP не активируется
      const was = userUnmuted;
      if (!was) { video.muted = false; video.volume = 1; userUnmuted = true; await new Promise(r => setTimeout(r,200)); }
      if (video.webkitPresentationMode === 'picture-in-picture') {
        video.webkitSetPresentationMode('inline');
        pipBtn.textContent = '🎥 PiP';
        if (!was) { video.muted = true; userUnmuted = false; }
      } else {
        video.webkitSetPresentationMode('picture-in-picture');
        pipBtn.textContent = '✕ PiP';
      }
      return;
    }
    if (video.requestPictureInPicture) {
      await video.requestPictureInPicture();
      pipBtn.textContent = '✕ PiP';
    }
  } catch(e) { console.log('PiP:', e); }
};
video.addEventListener('enterpictureinpicture', () => { pipBtn.textContent = '✕ PiP'; });
video.addEventListener('leavepictureinpicture', async () => {
  pipBtn.textContent = '🎥 PiP';
  if (!userUnmuted) video.muted = true;
  if (video.paused) { try { await video.play(); } catch(e) {} }
});
video.addEventListener('webkitpresentationmodechanged', () => {
  if (video.webkitPresentationMode !== 'picture-in-picture') {
    pipBtn.textContent = '🎥 PiP';
    if (!userUnmuted) video.muted = true;
  }
});

// ── Status ────────────────────────────────────────────────────────────────────
function setStatus(key, isError) {
  const msg = t[key] || key;
  statusEl.innerHTML = isError ? '⚠️ '+msg : '<span class="dot"></span>'+msg;
  reloadBtn.style.display = isError ? 'block' : 'none';
}

// ── UI ────────────────────────────────────────────────────────────────────────
function showUI() {
  overlay.classList.remove('hidden');
  if (hideTimeout) clearTimeout(hideTimeout);
  if (isExpanded && !audioOnly) hideTimeout = setTimeout(() => overlay.classList.add('hidden'), 4000);
}

// ── Fullscreen ────────────────────────────────────────────────────────────────
function enterFs() {
  if (isIOS() && video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
    isExpanded = true; fullscreenBtn.textContent = t.exitFs;
    return;
  }
  if (container.requestFullscreen) {
    container.requestFullscreen().catch(() => {});
  } else if (container.webkitRequestFullscreen) {
    container.webkitRequestFullscreen();
  }
  isExpanded = true; fullscreenBtn.textContent = t.exitFs;
}
function exitFs() {
  try { (document.exitFullscreen || document.webkitExitFullscreen)?.call(document); } catch(e) {}
  isExpanded = false; fullscreenBtn.textContent = t.fullscreen;
  overlay.classList.remove('hidden');
  if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }
}
fullscreenBtn.onclick = () => isExpanded ? exitFs() : enterFs();

document.addEventListener('fullscreenchange',        onFsChange);
document.addEventListener('webkitfullscreenchange',  onFsChange);
function onFsChange() {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) {
    isExpanded = true; fullscreenBtn.textContent = t.exitFs;
    overlay.classList.remove('hidden');
    if (hideTimeout) clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => overlay.classList.add('hidden'), 3000);
    video.style.objectFit = window.innerWidth > window.innerHeight ? 'cover' : 'contain';
  } else {
    isExpanded = false; fullscreenBtn.textContent = t.fullscreen;
    overlay.classList.remove('hidden');
    if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }
    video.style.objectFit = 'contain';
    if (!userUnmuted) video.muted = true;
  }
}
video.addEventListener('webkitendfullscreen', () => {
  isExpanded = false; fullscreenBtn.textContent = t.fullscreen;
  overlay.classList.remove('hidden');
  setTimeout(() => { stopStream(); init(); }, 300);
});

// ── Gestures ──────────────────────────────────────────────────────────────────
let lastTap = 0;
container.addEventListener('pointerup', e => {
  if (e.target.closest('button')) return;
  const now = Date.now();
  if (now - lastTap < 280) { isExpanded ? exitFs() : enterFs(); lastTap = 0; return; }
  lastTap = now;
  setTimeout(() => { if (Date.now() - lastTap >= 270) showUI(); }, 290);
});
container.addEventListener('pointermove',  () => { if (isExpanded) showUI(); });
container.addEventListener('touchstart',   () => { if (isExpanded) showUI(); }, { passive:true });

// ── Wake Lock ─────────────────────────────────────────────────────────────────
async function requestWakeLock() {
  try { if (!isIOS() && 'wakeLock' in navigator && !wakeLockSentinel) wakeLockSentinel = await navigator.wakeLock.request('screen'); } catch(e) {}
}

// ── Media Session ─────────────────────────────────────────────────────────────
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title:'Nova TV България', artist:'Live 🔴', album:'Nova TV',
    artwork:[{ src:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Nova_TV_Bulgaria_Logo.svg/512px-Nova_TV_Bulgaria_Logo.svg.png', sizes:'512x512', type:'image/png' }]
  });
  navigator.mediaSession.playbackState = 'playing';
  navigator.mediaSession.setActionHandler('play',  async () => { try { await video.play(); } catch(e) {} });
  navigator.mediaSession.setActionHandler('pause', ()      => { video.pause(); });
  navigator.mediaSession.setActionHandler('stop',  ()      => { video.pause(); });
}

// ── Audio mode ────────────────────────────────────────────────────────────────
function setAudioMode(on) {
  audioOnly = !!on;
  document.body.classList.toggle('audio-only', audioOnly);
  modeBtn.textContent = audioOnly ? t.videoMode : t.audioMode;
  if (audioOnly) { overlay.classList.remove('hidden'); if (hideTimeout) clearTimeout(hideTimeout); }
}
modeBtn.onclick = () => setAudioMode(!audioOnly);

// ── Unmute ────────────────────────────────────────────────────────────────────
unmuteBtn.onclick = () => {
  const ab = document.getElementById('audio-bg');
  if (video.muted) {
    video.muted = false; video.volume = 1; userUnmuted = true;
    unmuteBtn.textContent = '🔇 ' + t.mute;
    if (ab) { ab.muted = true; ab.pause(); }
  } else {
    video.muted = true; userUnmuted = false;
    unmuteBtn.textContent = t.unmute;
  }
};

// ── Stream ────────────────────────────────────────────────────────────────────
function stopStream() {
  if (hls)      { hls.destroy();      hls = null; }
  if (hlsAudio) { hlsAudio.destroy(); hlsAudio = null; }
  video.src = '';
  liveBadge.style.display    = 'none';
  liveBadgeTop.style.display = 'none';
  if (wakeLockSentinel) { wakeLockSentinel.release().catch(()=>{}); wakeLockSentinel = null; }
}

function loadStream(url) {
  userUnmuted = false;
  localStorage.setItem(CACHE_KEY, url);
  const proxied = PROXY_BASE + encodeURIComponent(url);
  stopStream(); setStatus('connecting'); unmuteBtn.style.display = 'none';

  if (isAndroid()) {
    const ab = document.getElementById('audio-bg');
    if (ab && Hls.isSupported()) {
      hlsAudio = new Hls({ liveSyncDurationCount:3, enableWorker:true });
      hlsAudio.loadSource(proxied); hlsAudio.attachMedia(ab);
      hlsAudio.on(Hls.Events.MANIFEST_PARSED, () => { ab.muted = true; ab.play().catch(()=>{}); });
    }
  }

  video.muted = true;
  if (Hls.isSupported()) {
    hls = new Hls({ liveSyncDurationCount:3, lowLatencyMode:true, enableWorker:true, backBufferLength:30 });
    hls.loadSource(proxied); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, async () => {
      setStatus('live');
      liveBadge.style.display = 'flex'; liveBadgeTop.style.display = 'inline';
      try {
        video.muted = true; await video.play();
        unmuteBtn.style.display = audioOnly ? 'none' : 'block';
        setupMediaSession(); if (!isIOS()) requestWakeLock();
      } catch(e) { setStatus('pressPlay'); }
    });
    hls.on(Hls.Events.ERROR, (ev, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { try { hls.startLoad(); } catch(err){} return; }
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR)   { try { hls.recoverMediaError(); } catch(err){} return; }
      setStatus('errorStream', true); setTimeout(() => init(), 5000);
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = proxied; setStatus('live');
    liveBadge.style.display = 'flex'; liveBadgeTop.style.display = 'inline';
    video.play()
      .then(() => { unmuteBtn.style.display = audioOnly ? 'none' : 'block'; setupMediaSession(); })
      .catch(() => setStatus('pressPlay'));
  }
}

// ── Background playback ───────────────────────────────────────────────────────
let pauseByUser = false;
video.addEventListener('mousedown', () => { pauseByUser = true; });
video.addEventListener('touchstart', () => { pauseByUser = true; }, { passive:true });
video.addEventListener('pause', () => {
  if (isIOS() || (isAndroid() && pauseByUser)) userPaused = true;
  pauseByUser = false;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});
video.addEventListener('play', () => {
  if (!userUnmuted) video.muted = true;
  userPaused = false;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  if (isAndroid()) { const ab = document.getElementById('audio-bg'); if (ab) ab.muted = true; }
});
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') {
    if (isIOS() || userPaused) return;
    setTimeout(async () => {
      if (video.paused) { try { await video.play(); } catch(e) {} }
      const ab = document.getElementById('audio-bg');
      if (isAndroid() && ab) { ab.muted = false; if (ab.paused) { try { await ab.play(); } catch(e){} } video.muted = true; }
    }, 300);
  } else {
    if (!userUnmuted) video.muted = true;
    if (isAndroid()) { const ab = document.getElementById('audio-bg'); if (ab) ab.muted = true; }
    if (!userPaused && video.paused) {
      try { await video.play(); } catch(e) { stopStream(); init(); }
    } else if (!userPaused && video.readyState < 2) { stopStream(); init(); }
  }
});
window.addEventListener('pageshow', async () => {
  if (!userPaused && video.paused) { try { await video.play(); } catch(e) {} }
});

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  setStatus('loading'); reloadBtn.style.display = 'none'; unmuteBtn.style.display = 'none';
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) loadStream(cached);
  try {
    const r = await fetch(STREAM_API + '?t=' + Date.now(), { cache:'no-store' });
    const d = await r.json();
    if (d.url) loadStream(d.url);
    else if (!cached) setStatus('errorUrl', true);
  } catch(e) { if (!cached) setStatus('errorServer', true); }
}
reloadBtn.onclick = () => { userPaused = false; init(); };

setInterval(() => {
  fetch(STREAM_API + '?t=' + Date.now(), { cache:'no-store' })
    .then(r => r.json()).then(d => { if (d.url) loadStream(d.url); }).catch(()=>{});
}, 20 * 60 * 1000);

init();
</script>
</body>
</html>
