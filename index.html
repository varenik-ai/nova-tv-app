<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova TV</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, sans-serif; color: white; }
    .logo { font-size: 28px; font-weight: 900; color: #e63946; letter-spacing: 2px; margin-bottom: 16px; text-transform: uppercase; }
    .logo span { color: white; }
    #video-container { width: 100%; max-width: 900px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    video { width: 100%; display: block; background: #000; }
    #status { margin-top: 14px; font-size: 13px; color: #888; text-align: center; }
    .dot { display: inline-block; width: 8px; height: 8px; background: #e63946; border-radius: 50%; margin-right: 6px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.2} }
    #reload-btn { margin-top: 12px; padding: 10px 28px; background: #e63946; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; display: none; }
    #unmute-btn { margin-top: 12px; padding: 10px 24px; background: #e63946; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; display: none; }
  </style>
</head>
<body>
<div class="logo">NOVA <span>TV</span></div>
<div id="video-container">
  <video id="video" controls autoplay muted playsinline webkit-playsinline airplay="allow"></video>
</div>
<div id="status"><span class="dot"></span>...</div>
<button id="reload-btn" onclick="init()">🔄</button>
<button id="unmute-btn" onclick="unmute()">🔊</button>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  const TRANSLATIONS = {
    ru: { loading:'Получаем поток...', connecting:'Подключение...', live:'Nova TV — прямой эфир 🔴', pressPlay:'Нажмите ▶', errorStream:'Ошибка — переподключаемся...', errorUrl:'Не удалось получить URL', errorServer:'Ошибка сервера', reconnect:'🔄 Переподключиться', unmute:'🔊 Включить звук' },
    bg: { loading:'Зареждаме...', connecting:'Свързване...', live:'Nova TV — на живо 🔴', pressPlay:'Натиснете ▶', errorStream:'Грешка...', errorUrl:'Неуспешно', errorServer:'Грешка', reconnect:'🔄 Свържи отново', unmute:'🔊 Включи звук' },
    en: { loading:'Loading...', connecting:'Connecting...', live:'Nova TV — Live 🔴', pressPlay:'Press ▶', errorStream:'Error — reconnecting...', errorUrl:'Failed to get URL', errorServer:'Server error', reconnect:'🔄 Reconnect', unmute:'🔊 Unmute' },
    de: { loading:'Laden...', connecting:'Verbinden...', live:'Nova TV — Live 🔴', pressPlay:'▶ drücken', errorStream:'Fehler...', errorUrl:'URL Fehler', errorServer:'Serverfehler', reconnect:'🔄 Neu verbinden', unmute:'🔊 Ton an' },
    fr: { loading:'Chargement...', connecting:'Connexion...', live:'Nova TV — En direct 🔴', pressPlay:'Appuyez ▶', errorStream:'Erreur...', errorUrl:'URL introuvable', errorServer:'Erreur serveur', reconnect:'🔄 Reconnecter', unmute:'🔊 Son' },
    es: { loading:'Cargando...', connecting:'Conectando...', live:'Nova TV — En vivo 🔴', pressPlay:'Presione ▶', errorStream:'Error...', errorUrl:'URL fallida', errorServer:'Error servidor', reconnect:'🔄 Reconectar', unmute:'🔊 Sonido' },
    uk: { loading:'Отримуємо...', connecting:'Підключення...', live:'Nova TV — прямий ефір 🔴', pressPlay:'Натисніть ▶', errorStream:'Помилка...', errorUrl:'URL не знайдено', errorServer:'Помилка сервера', reconnect:'🔄 Перепідключитись', unmute:'🔊 Звук' },
    tr: { loading:'Yükleniyor...', connecting:'Bağlanıyor...', live:'Nova TV — Canlı 🔴', pressPlay:'▶ basın', errorStream:'Hata...', errorUrl:'URL alınamadı', errorServer:'Sunucu hatası', reconnect:'🔄 Yeniden Bağlan', unmute:'🔊 Ses' },
  };

  function getLang() {
    try {
      const tgLang = Telegram.WebApp.initDataUnsafe?.user?.language_code;
      if (tgLang) { const s = tgLang.split('-')[0].toLowerCase(); if (TRANSLATIONS[s]) return s; }
    } catch(e) {}
    const b = (navigator.language || 'en').split('-')[0].toLowerCase();
    return TRANSLATIONS[b] ? b : 'en';
  }

  const lang = getLang();
  const t = TRANSLATIONS[lang];
  document.documentElement.lang = lang;
  document.getElementById('reload-btn').textContent = t.reconnect;
  document.getElementById('unmute-btn').textContent = t.unmute;

  const STREAM_API = 'https://nova-proxy-eight.vercel.app/api/stream';
  const PROXY_BASE = 'https://nova-proxy-eight.vercel.app/api/proxy?url=';

  const video     = document.getElementById('video');
  const status    = document.getElementById('status');
  const reloadBtn = document.getElementById('reload-btn');
  const unmuteBtn = document.getElementById('unmute-btn');
  let hls;

  function setStatus(key, isError) {
    const msg = t[key] || key;
    status.innerHTML = isError ? '⚠️ ' + msg : '<span class="dot"></span>' + msg;
    reloadBtn.style.display = isError ? 'block' : 'none';
  }

  function unmute() {
    video.muted = false;
    video.volume = 1.0;
    unmuteBtn.style.display = 'none';
  }

  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Nova TV Bulgaria',
      artist: 'Live 🔴',
      album: 'Nova TV',
      artwork: [{ src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Nova_TV_Bulgaria_Logo.svg/512px-Nova_TV_Bulgaria_Logo.svg.png', sizes: '512x512', type: 'image/png' }]
    });
    navigator.mediaSession.setActionHandler('play', () => { video.play(); navigator.mediaSession.playbackState = 'playing'; });
    navigator.mediaSession.setActionHandler('pause', () => { video.pause(); navigator.mediaSession.playbackState = 'paused'; });
    navigator.mediaSession.setActionHandler('stop', () => { video.pause(); navigator.mediaSession.playbackState = 'paused'; });
    navigator.mediaSession.playbackState = 'playing';
  }

  // Не останавливаем воспроизведение при скрытии страницы
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (!video.paused) {
        // Принудительно продолжаем воспроизведение
        video.play().catch(() => {});
      }
    }
  });

  // Возобновляем если остановилось
  video.addEventListener('pause', () => {
    if (document.visibilityState === 'hidden') {
      setTimeout(() => {
        if (video.paused && document.visibilityState === 'hidden') {
          video.play().catch(() => {});
        }
      }, 500);
    }
  });

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async () => {
          if (document.visibilityState === 'visible') {
            try { await navigator.wakeLock.request('screen'); } catch(e) {}
          }
        });
      }
    } catch(e) {}
  }

  function loadStream(url) {
    const proxiedUrl = PROXY_BASE + encodeURIComponent(url);
    if (hls) hls.destroy();
    setStatus('connecting');
    unmuteBtn.style.display = 'none';
    if (Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3, enableWorker: true });
      hls.loadSource(proxiedUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setStatus('live');
        video.muted = true;
        video.play().then(() => {
          unmuteBtn.style.display = 'block';
          setupMediaSession();
          requestWakeLock();
        }).catch(() => setStatus('pressPlay'));
      });
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) { setStatus('errorStream', true); setTimeout(init, 3000); }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxiedUrl;
      video.muted = true;
      video.play().then(() => {
        unmuteBtn.style.display = 'block';
        setupMediaSession();
        requestWakeLock();
      });
      setStatus('live');
    }
  }

  async function init() {
    setStatus('loading');
    reloadBtn.style.display = 'none';
    unmuteBtn.style.display = 'none';
    try {
      const r = await fetch(STREAM_API + '?t=' + Date.now());
      const d = await r.json();
      if (d.url) loadStream(d.url);
      else setStatus('errorUrl', true);
    } catch(e) {
      setStatus('errorServer', true);
    }
  }

  init();
  setInterval(init, 25 * 60 * 1000);
</script>
</body>
</html>
